[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "draft-rag"
version = "0.1.0"
description = "Dual-source RAG system with intent and urgency classification for automated customer service email drafting."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "datasets>=3.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.9",
    "jinja2>=3.1",
    "typer>=0.12",
    "httpx>=0.27",
    "joblib>=1.4",
]

[project.optional-dependencies]
inference = [
    "torch>=2.4",
    "transformers>=4.46",
    "sentence-transformers>=3.3",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]
train = [
    "torch>=2.4",
    "transformers>=4.46",
    "sentence-transformers>=3.3",
    "accelerate>=1.0",
    "peft>=0.13",
    "trl>=0.12",
    "bitsandbytes>=0.44",
    "scipy>=1.14",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]
eval = [
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "evaluate>=0.4.3",
]
ui = [
    "streamlit>=1.39",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
draft = "draft.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/draft"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
