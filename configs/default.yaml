paths:
  raw_dir: data/raw
  processed_dir: data/processed
  org_docs_file: data/org_docs/organization_docs.csv
  artifacts_dir: artifacts
  prompts_dir: prompts
  reports_dir: reports

data:
  hf_dataset_id: Tobi-Bueck/customer-support-tickets
  language: en
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  random_seed: 42
  min_email_chars: 20
  min_answer_chars: 20

taxonomy:
  intents:
    - Technical Support
    - Product Support
    - Customer Service
    - IT Support
    - Billing and Payments
    - Returns and Exchanges
    - Service Outages and Maintenance
    - Sales and Pre-Sales
    - Human Resources
    - General Inquiry
  urgencies:
    - low
    - medium
    - high
  doc_categories:
    - Billing and Payments
    - Account and Access
    - Integrations
    - Performance
    - Outages and Maintenance
    - Security and Compliance
    - Data Analytics
    - Digital Marketing
    - Sales and Pre-Sales
    - Returns and Exchanges
    - Human Resources
    - General Inquiry
  intent_to_doc_categories:
    Technical Support:
      - Account and Access
      - Integrations
      - Performance
      - Security and Compliance
      - Data Analytics
      - Outages and Maintenance
    Product Support:
      - Integrations
      - Performance
      - Data Analytics
      - Digital Marketing
      - Account and Access
    Customer Service:
      - General Inquiry
      - Account and Access
      - Billing and Payments
      - Returns and Exchanges
    IT Support:
      - Account and Access
      - Security and Compliance
      - Performance
      - Outages and Maintenance
      - Integrations
    Billing and Payments:
      - Billing and Payments
      - Returns and Exchanges
    Returns and Exchanges:
      - Returns and Exchanges
      - Billing and Payments
    Service Outages and Maintenance:
      - Outages and Maintenance
      - Performance
      - Security and Compliance
    Sales and Pre-Sales:
      - Sales and Pre-Sales
      - Digital Marketing
      - Billing and Payments
    Human Resources:
      - Human Resources
      - General Inquiry
    General Inquiry:
      - General Inquiry
      - Account and Access
      - Sales and Pre-Sales

classifier:
  backbone_model: microsoft/deberta-v3-small
  max_length: 256
  batch_size: 32
  epochs: 4
  learning_rate: 3.0e-5
  urgency_loss_weight: 1.0

retrieval:
  embedding_model: BAAI/bge-small-en-v1.5
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k_docs: 3
  top_k_responses: 3
  dense_weight: 0.65
  bm25_weight: 0.35
  intent_boost: 0.15
  rrf_k: 60

generation:
  base_model: Qwen/Qwen2.5-3B-Instruct
  ollama_model: draft-qwen25-3b
  ollama_base_url: http://localhost:11434
  max_new_tokens: 384
  temperature: 0.2
